<svg xmlns="http://www.w3.org/2000/svg" width="440" height="200" viewBox="0 0 440 200" role="img" aria-label="NexusWhitelist">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b14"/><stop offset="1" stop-color="#100c25"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".5" stop-color="#e6cf9d" stop-opacity=".18"/><stop offset="1" stop-color="#22d3ee" stop-opacity=".2"/></linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#c4b5fd" stop-opacity=".20"/><stop offset="1" stop-color="#c4b5fd" stop-opacity="0"/></radialGradient>
    <filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <clipPath id="c"><rect width="440" height="200" rx="22"/></clipPath>
  </defs>
  <style>
    .trace{animation:trace 9s linear 7.7s infinite}
    @keyframes trace{to{stroke-dashoffset:-100}}
    .cell{animation:cell 2.4s ease-in-out infinite}
    @keyframes cell{0%,100%{opacity:.3}50%{opacity:1}}
    .slash{animation:cell 2s ease-in-out infinite}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pl 2.4s ease-in-out infinite}
    @keyframes pl{50%{transform:scale(1.5)}}
    .chk{animation:chk 4s ease-in-out infinite}
    @keyframes chk{0%,25%{stroke-dashoffset:20}50%,90%{stroke-dashoffset:0}100%{stroke-dashoffset:20}}
    .spark{transform-box:fill-box;transform-origin:center;animation:sp 3s ease-in-out infinite}
    @keyframes sp{50%{transform:scale(1.5) rotate(45deg)}}
    .plus{transform-box:fill-box;transform-origin:center;animation:pp 4s ease-in-out infinite}
    @keyframes pp{40%,60%{transform:rotate(90deg)}100%{transform:rotate(90deg)}}
    .glow{animation:gl 6s ease-in-out 7.7s infinite alternate}
    @keyframes gl{from{opacity:.55}to{opacity:1}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#c)">
    <rect width="440" height="200" fill="url(#bg)"/>
    <rect class="glow" width="440" height="200" fill="url(#glow)"/>
  </g>
  <rect x=".75" y=".75" width="438.5" height="198.5" rx="21.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  <rect class="trace" x=".75" y=".75" width="438.5" height="198.5" rx="21.25" fill="none" stroke="#c4b5fd" stroke-width="2.2" stroke-linecap="round" pathLength="100" stroke-dasharray="9 91" filter="url(#b)"/>
  <path d="M30 .75 H410" stroke="#e6cf9d" stroke-opacity=".3"/>
  <rect x="24" y="22" width="52" height="52" rx="15" fill="#1a1642" stroke="#43308f"/>
  <g transform="translate(50 48)"><path d="M0 -15 L13 0 L0 15 L-13 0 Z" fill="none" stroke="#c4b5fd" stroke-width="2.2" stroke-linejoin="round"/><path d="M-13 0 H13 M0 -15 L-5 0 L0 15 M0 -15 L5 0 L0 15" fill="none" stroke="#c4b5fd" stroke-opacity=".5" stroke-width="1.4"/><circle class="pulse" r="3.4" fill="#fff"/></g>
  <text x="90" y="53" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-size="23" font-weight="600" fill="#f4f6fb">NexusWhitelist</text>
  <text x="90" y="71" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#64748b">Open project</text>
  <circle cx="365.6" cy="26" r="4.5" fill="#c4b5fd"/><text x="377.6" y="30.5" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#cbd5e6">Web3</text>
  <text x="24" y="108" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#93a1b8">Merkle-proof NFT whitelist checker with</text><text x="24" y="128" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#93a1b8">a Next.js frontend and Solidity contracts.</text>
  <g transform="translate(24.0 146)"><rect width="71.7" height="26" rx="13" fill="#0c1528" stroke="#22304a"/><text x="35.8" y="17.5" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#b6c3d9">Next.js</text></g><g transform="translate(103.7 146)"><rect width="71.7" height="26" rx="13" fill="#0c1528" stroke="#22304a"/><text x="35.8" y="17.5" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#b6c3d9">Hardhat</text></g><g transform="translate(183.4 146)"><rect width="78.8" height="26" rx="13" fill="#0c1528" stroke="#22304a"/><text x="39.4" y="17.5" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#b6c3d9">Solidity</text></g>
</svg>
