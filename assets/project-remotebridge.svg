  <text x="90" y="53" font-family="'Iowan Old Style','Palatino Linotype',Georgia,serif" font-size="23" font-weight="600" fill="#f4f6fb">RemoteBridge</text>
  <text x="90" y="71" font-family="Inter,'Segoe UI',system-ui,Arial,sans-serif" font-size="12.5" fill="#7183a0">Cross-platform collaboration</text>
  <circle cx="293" cy="26" r="4.5" fill="#67e8f9"/><text x="305" y="30.5" font-family="Inter,'Segoe UI',system-ui,Arial,sans-serif" font-size="13" fill="#cbd5e6">Desktop + mobile</text>
  <text x="24" y="108" font-family="Inter,'Segoe UI',system-ui,Arial,sans-serif" font-size="14" fill="#a7b5c9">Self-hostable remote desktop and device fleet tools.</text>
  <text x="24" y="128" font-family="Inter,'Segoe UI',system-ui,Arial,sans-serif" font-size="14" fill="#a7b5c9">Connect desktop and mobile clients through relay services.</text>
