    <text x="198" y="134" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#93a1b8">Product development, APIs, automation and full-stack engineering</text>
  </g>
