<svg xmlns="http://www.w3.org/2000/svg" width="900" height="488" viewBox="0 0 900 488" role="img" aria-label="Experience timeline">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05080f"/><stop offset="1" stop-color="#110d27"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset=".5" stop-color="#e6cf9d" stop-opacity=".2"/><stop offset="1" stop-color="#22d3ee" stop-opacity=".22"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e6cf9d"/><stop offset="1" stop-color="#c9a96a"/></linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#67e8f9" stop-opacity=".1"/><stop offset=".5" stop-color="#8b5cf6" stop-opacity=".6"/><stop offset="1" stop-color="#e6cf9d" stop-opacity=".9"/></linearGradient>
    <radialGradient id="pulseG"><stop offset="0" stop-color="#67e8f9" stop-opacity=".9"/><stop offset="1" stop-color="#67e8f9" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .ent{animation:ent .9s cubic-bezier(.2,.7,.2,1) backwards} @keyframes ent{from{opacity:0;transform:translateX(-12px)}}
    .nd{animation:nd 3.6s ease-in-out infinite} @keyframes nd{0%,100%{opacity:.5}20%{opacity:1}}
    .trav{animation:trav 6s ease-in-out infinite alternate} @keyframes trav{from{transform:translateY(0)}to{transform:translateY(320px)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <rect width="900" height="488" rx="30" fill="url(#bg)"/>
