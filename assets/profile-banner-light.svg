    <circle class="tw" cx="1158.1" cy="302.1" r="1.8" fill="#170364" style="animation-delay:-1.56s;animation-duration:5.92s"/>
    <circle class="tw" cx="539.8" cy="353.8" r="1.4" fill="#121212" style="animation-delay:-5.73s;animation-duration:4.78s"/>
    <circle class="tw" cx="146.5" cy="189.5" r="1.4" fill="#08b4cb" style="animation-delay:-1.23s;animation-duration:5.68s"/>
    <rect class="sweepBeam" x="0" y="0" width="170" height="400" fill="url(#beam)"/>

    <!-- security core -->
    <g transform="translate(940 200)">
      <g class="coreIn">
        <circle r="190" fill="url(#coreGlow)"/>
        <g class="cw"><circle r="160" fill="none" stroke="#08b4cb" stroke-opacity=".38" stroke-width="9" stroke-dasharray="1.4 8.64"/></g>
        <g class="ccw">
          <circle r="128" fill="none" stroke="url(#accent)" stroke-width="1.6" stroke-dasharray="52 16" opacity=".9"/>
          <circle cx="22.2" cy="126.1" r="3.4" fill="#b98e2f"/><circle cx="-120.3" cy="-43.8" r="3.4" fill="#b98e2f"/><circle cx="98.1" cy="-82.3" r="3.4" fill="#b98e2f"/>
        </g>
        <g class="radar"><path d="M0 0 L90.5 -90.5 A128 128 0 0 1 128 0 Z" fill="url(#sweep)"/><line x1="0" y1="0" x2="128" y2="0" stroke="#08b4cb" stroke-opacity=".85" stroke-width="1.3"/></g>
        <g stroke="#08b4cb" stroke-opacity=".22" stroke-width="1"><line x1="58.0" y1="0.0" x2="128.0" y2="0.0"/><line x1="29.0" y1="50.2" x2="64.0" y2="110.9"/><line x1="-29.0" y1="50.2" x2="-64.0" y2="110.9"/><line x1="-58.0" y1="0.0" x2="-128.0" y2="0.0"/><line x1="-29.0" y1="-50.2" x2="-64.0" y2="-110.9"/><line x1="29.0" y1="-50.2" x2="64.0" y2="-110.9"/></g>
        <g class="cw2"><circle r="96" fill="none" stroke="#420bc0" stroke-opacity=".55"/><circle cx="90.2" cy="32.8" r="6" fill="#d6deef" stroke="#08b4cb" stroke-width="1.6"/><circle cx="90.2" cy="32.8" r="2.2" fill="#08b4cb"/><circle cx="-73.5" cy="61.7" r="6" fill="#d6deef" stroke="#08b4cb" stroke-width="1.6"/><circle cx="-73.5" cy="61.7" r="2.2" fill="#08b4cb"/><circle cx="-16.7" cy="-94.5" r="6" fill="#d6deef" stroke="#08b4cb" stroke-width="1.6"/><circle cx="-16.7" cy="-94.5" r="2.2" fill="#08b4cb"/></g>
        <circle class="halo" r="62" fill="none" stroke="#08b4cb" stroke-width="1.5"/>
        <path d="M51.96 30.00 L0.00 60.00 L-51.96 30.00 L-51.96 -30.00 L-0.00 -60.00 L51.96 -30.00 Z" fill="#d8dff3" stroke="url(#gold)" stroke-width="2.2"/>
        <path d="M41.57 24.00 L0.00 48.00 L-41.57 24.00 L-41.57 -24.00 L-0.00 -48.00 L41.57 -24.00 Z" fill="none" stroke="#08b4cb" stroke-opacity=".28"/>
        <text y="12" text-anchor="middle" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-style="italic" font-size="36" font-weight="700" fill="url(#goldv)">SA</text>
      </g>
    </g>

    <!-- floating tags -->
    <g font-family="'JetBrains Mono','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" text-anchor="middle">
      <g class="fl1"><rect x="752" y="84" width="74" height="26" rx="13" fill="#cad6f0" stroke="#a0c9df"/><text x="789" y="102" fill="#08b4cb">NestJS</text></g>
      <g class="fl2"><rect x="1070" y="132" width="78" height="26" rx="13" fill="#cad6f0" stroke="#9c8fd6"/><text x="1109" y="150" fill="#170364">Django</text></g>
      <g class="fl3"><rect x="1040" y="306" width="84" height="26" rx="13" fill="#cad6f0" stroke="#d6caad"/><text x="1082" y="324" fill="#b98e2f">FastAPI</text></g>
    </g>

    <!-- copy -->
    <g class="rise" style="animation-delay:.2s">
      <rect x="72" y="56" width="370" height="36" rx="18" fill="#cbdaf1" stroke="#a7c7df"/>
      <circle class="dot" cx="94" cy="74" r="4.5" fill="#1c825d"/>
      <text x="110" y="79.5" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#04415a">Software development and full-stack engineering</text>
    </g>
    <g class="rise" style="animation-delay:.45s">
      <text x="70" y="172" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-size="76" font-weight="600" letter-spacing="-1" fill="url(#nameFill)">Sadiq Abdullahi</text>
      <g clip-path="url(#nameClip)"><rect class="shine" x="0" y="96" width="190" height="100" fill="url(#sheen)" transform="skewX(-16)"/></g>
