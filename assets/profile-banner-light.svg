    <rect class="line" x="228" y="198" width="60" height="3" rx="1.5" fill="url(#accent)" opacity=".8" style="animation-delay:1.1s"/>
    <g class="rise" style="animation-delay:.75s">
      <text x="72" y="244" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="27" font-weight="500" fill="#13223a">Useful products. Practical engineering.</text>
      <text x="72" y="278" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="18" fill="#4d5c75">Founder of Devlify, building from Gusau, Nigeria</text>
    </g>
    <g class="rise" style="animation-delay:1s" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" text-anchor="middle">
      <rect x="72" y="306" width="178" height="38" rx="19" fill="#cbdaf1" stroke="#a0c9df"/><text x="161" y="330" fill="#046672">Build with care</text>
      <rect x="262" y="306" width="124" height="38" rx="19" fill="#c9c5eb" stroke="#9181d4"/><text x="324" y="330" fill="#0e0247">Full-stack</text>
      <rect x="398" y="306" width="176" height="38" rx="19" fill="#ede7da" stroke="#d6caad"/><text x="486" y="330" fill="#b98e2f">Product builder</text>
    </g>
    <text x="72" y="378" font-family="'JetBrains Mono','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#76869c">@devlify-marketplace</text>
    <text x="1130" y="378" text-anchor="end" font-family="'JetBrains Mono','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#76869c">12.16°N  6.66°E</text>
  </g>
  <rect x="1" y="1" width="1198" height="398" rx="29" fill="none" stroke="url(#frame)" stroke-width="1.5"/>
  <rect class="border" x="1" y="1" width="1198" height="398" rx="29" fill="none" stroke="#08b4cb" stroke-width="2.4" stroke-linecap="round" pathLength="100" stroke-dasharray="7 93" filter="url(#blur3)" opacity=".9"/>
</svg>
