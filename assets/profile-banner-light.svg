<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">Sadiq Abdullahi, Software Developer and full-stack engineer</title>
  <desc id="d">An animated obsidian banner with a rotating security core, drifting aurora light and a shimmering name.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3e8f5"/><stop offset=".55" stop-color="#cfd8f0"/><stop offset="1" stop-color="#ccc3ed"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b98e2f"/><stop offset="1" stop-color="#9d7c39"/>
    </linearGradient>
    <linearGradient id="goldv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#483300"/><stop offset="1" stop-color="#9d7c39"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c8598"/><stop offset="1" stop-color="#420bc0"/>
    </linearGradient>
    <linearGradient id="nameFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121212"/><stop offset="1" stop-color="#0c274f"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121212" stop-opacity=".22"/>
      <stop offset=".5" stop-color="#b98e2f" stop-opacity=".28"/>
      <stop offset="1" stop-color="#0c8598" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#121212" stop-opacity="0"/><stop offset=".5" stop-color="#121212" stop-opacity=".95"/><stop offset="1" stop-color="#121212" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#121212" stop-opacity="0"/><stop offset=".5" stop-color="#00445c" stop-opacity=".07"/><stop offset="1" stop-color="#121212" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sweep" cx="0" cy="0" r="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0c8598" stop-opacity="0"/><stop offset="1" stop-color="#0c8598" stop-opacity=".42"/>
    </radialGradient>
    <radialGradient id="coreGlow">
      <stop offset="0" stop-color="#0c8598" stop-opacity=".35"/><stop offset="1" stop-color="#0c8598" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gridFade" cx="940" cy="200" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridMask"><rect width="1200" height="400" fill="url(#gridFade)"/></mask>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#4d5d74" stroke-opacity=".10"/>
    </pattern>
    <filter id="blur70" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="blur3" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="card"><rect width="1200" height="400" rx="30"/></clipPath>
    <clipPath id="nameClip"><text x="70" y="172" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-size="76" font-weight="600" letter-spacing="-1">Sadiq Abdullahi</text></clipPath>
  </defs>
  <style>
    .rise{animation:rise 1s cubic-bezier(.2,.7,.2,1) backwards}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}}
    .coreIn{animation:coreIn 1.8s cubic-bezier(.2,.8,.2,1) .15s backwards}
    @keyframes coreIn{from{opacity:0;transform:scale(.55) rotate(-40deg)}}
    .cw{animation:spin 90s linear infinite}
    .ccw{animation:spin 55s linear infinite reverse}
    .cw2{animation:spin 34s linear infinite}
    .radar{animation:spin 7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .halo{transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
    @keyframes halo{from{transform:scale(.9);opacity:.7}to{transform:scale(1.7);opacity:0}}
    .blip{animation:blip 2s ease-in-out infinite}
    @keyframes blip{50%{opacity:.25}}
    .tw{animation:tw 5s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.12}50%{opacity:.95}}
    .a1{animation:d1 16s ease-in-out infinite alternate}
    .a2{animation:d2 20s ease-in-out infinite alternate}
    .a3{animation:d1 24s ease-in-out infinite alternate-reverse}
    @keyframes d1{to{transform:translate(-70px,34px)}}
    @keyframes d2{to{transform:translate(60px,-40px)}}
    .shine{animation:shine 8s ease-in-out 2.4s infinite}
    @keyframes shine{0%{transform:translateX(-260px)}30%,100%{transform:translateX(620px)}}
    .sweepBeam{animation:beam 12s linear 1s infinite}
    @keyframes beam{from{transform:translateX(-260px) skewX(-18deg)}to{transform:translateX(1500px) skewX(-18deg)}}
    .border{animation:trace 14s linear infinite}
    @keyframes trace{to{stroke-dashoffset:-100}}
    .line{transform-box:fill-box;transform-origin:left;animation:grow 1.2s cubic-bezier(.2,.7,.2,1) .9s backwards}
    @keyframes grow{from{transform:scaleX(0)}}
    .dot{animation:ping 2.2s ease-in-out infinite}
    @keyframes ping{50%{opacity:.35}}
    .fl1{animation:fl 5s ease-in-out infinite}
    .fl2{animation:fl 6s ease-in-out -2s infinite}
    .fl3{animation:fl 5.5s ease-in-out -4s infinite}
    @keyframes fl{50%{transform:translateY(-7px)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="400" fill="url(#bg)"/>
    <g filter="url(#blur70)">
      <ellipse class="a1" cx="960" cy="190" rx="330" ry="190" fill="#0c8598" opacity=".17"/>
      <ellipse class="a2" cx="1130" cy="390" rx="300" ry="150" fill="#450fa2" opacity=".30"/>
      <ellipse class="a3" cx="140" cy="430" rx="380" ry="110" fill="#9d7c39" opacity=".12"/>
    </g>
    <rect width="1200" height="400" fill="url(#grid)" mask="url(#gridMask)"/>
