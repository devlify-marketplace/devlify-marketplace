    <circle class="tw" cx="358.2" cy="369.0" r="0.9" fill="#170364" style="animation-delay:-3.07s;animation-duration:4.08s"/>
    <circle class="tw" cx="203.3" cy="196.1" r="0.9" fill="#170364" style="animation-delay:-5.77s;animation-duration:3.77s"/>
    <circle class="tw" cx="417.7" cy="147.3" r="1.8" fill="#08b4cb" style="animation-delay:-3.48s;animation-duration:5.10s"/>
    <circle class="tw" cx="1106.9" cy="190.9" r="0.9" fill="#b98e2f" style="animation-delay:-0.36s;animation-duration:5.96s"/>
    <circle class="tw" cx="354.4" cy="159.8" r="1.4" fill="#121212" style="animation-delay:-0.14s;animation-duration:5.12s"/>
    <circle class="tw" cx="726.4" cy="197.8" r="1.1" fill="#121212" style="animation-delay:-4.61s;animation-duration:3.95s"/>
    <circle class="tw" cx="483.6" cy="346.7" r="1.8" fill="#170364" style="animation-delay:-0.48s;animation-duration:5.07s"/>
    <circle class="tw" cx="1037.1" cy="312.4" r="1.4" fill="#b98e2f" style="animation-delay:-4.24s;animation-duration:6.95s"/>
    <circle class="tw" cx="1121.8" cy="77.1" r="1.1" fill="#08b4cb" style="animation-delay:-0.91s;animation-duration:5.80s"/>
    <circle class="tw" cx="582.9" cy="231.4" r="1.4" fill="#170364" style="animation-delay:-1.69s;animation-duration:4.01s"/>
    <circle class="tw" cx="725.2" cy="136.2" r="1.1" fill="#08b4cb" style="animation-delay:-4.14s;animation-duration:5.30s"/>
    <circle class="tw" cx="550.6" cy="330.6" r="1.8" fill="#b98e2f" style="animation-delay:-2.39s;animation-duration:4.88s"/>
    <circle class="tw" cx="753.1" cy="45.9" r="0.9" fill="#08b4cb" style="animation-delay:-5.91s;animation-duration:5.04s"/>
    <circle class="tw" cx="417.7" cy="42.5" r="0.9" fill="#170364" style="animation-delay:-3.40s;animation-duration:5.38s"/>
    <circle class="tw" cx="729.7" cy="48.8" r="1.1" fill="#170364" style="animation-delay:-3.68s;animation-duration:4.02s"/>
    <circle class="tw" cx="1119.2" cy="236.0" r="1.8" fill="#b98e2f" style="animation-delay:-0.74s;animation-duration:6.47s"/>
