<svg xmlns="http://www.w3.org/2000/svg" width="900" height="170" viewBox="0 0 900 170" role="img" aria-label="Building useful software. Shipping useful products. Improving with every release.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05080f"/><stop offset="1" stop-color="#140d2c"/></linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee" stop-opacity=".22"/><stop offset="1" stop-color="#8b5cf6" stop-opacity=".22"/></linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c9a96a" stop-opacity=".18"/><stop offset="1" stop-color="#22d3ee" stop-opacity=".14"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset=".5" stop-color="#e6cf9d" stop-opacity=".2"/><stop offset="1" stop-color="#22d3ee" stop-opacity=".22"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e6cf9d"/><stop offset="1" stop-color="#c9a96a"/></linearGradient>
    <clipPath id="c"><rect width="900" height="170" rx="30"/></clipPath>
  </defs>
  <style>
    .w1{animation:wv 14s linear infinite}
    .w2{animation:wv 22s linear infinite reverse}
    @keyframes wv{to{transform:translateX(450px)}}
    .in{animation:in 1.4s cubic-bezier(.2,.7,.2,1) backwards}
    @keyframes in{from{opacity:0;transform:translateY(10px)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#c)">
    <rect width="900" height="170" fill="url(#bg)"/>
    <path class="w2" d="M-450 118 q112.5 -26 225.0 0 t225.0 0 q112.5 -26 225.0 0 t225.0 0 q112.5 -26 225.0 0 t225.0 0 q112.5 -26 225.0 0 t225.0 0 V180 H-450 Z" fill="url(#w2)"/>
    <path class="w1" d="M-450 132 q112.5 -34 225.0 0 t225.0 0 q112.5 -34 225.0 0 t225.0 0 q112.5 -34 225.0 0 t225.0 0 q112.5 -34 225.0 0 t225.0 0 V180 H-450 Z" fill="url(#w1)"/>
    <g class="in" text-anchor="middle">
      <text x="450.0" y="70" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-style="italic" font-size="30" fill="#f4f6fb">Building useful software.</text>
      <text x="450.0" y="108" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-style="italic" font-size="21" fill="#b9c6dc">Shipping useful products. Improving with every release.</text>
    </g>
    <rect x="422.0" y="132" width="56" height="2.5" rx="1.2" fill="url(#gold)"/>
  </g>
  <rect x=".75" y=".75" width="898.5" height="168.5" rx="29.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
</svg>
