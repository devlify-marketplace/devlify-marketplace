<svg xmlns="http://www.w3.org/2000/svg" width="900" height="124" viewBox="0 0 900 124" role="img" aria-label="5 plus years of engineering experience, 1,000 plus projects, based in Gusau, Nigeria">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1222"/><stop offset="1" stop-color="#0c0b1f"/></linearGradient>
    <linearGradient id="tileEdge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset=".5" stop-color="#e6cf9d" stop-opacity=".18"/><stop offset="1" stop-color="#22d3ee" stop-opacity=".22"/></linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#b9cdea"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".10"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    .sh{animation:sh 7s ease-in-out infinite}
    @keyframes sh{0%{transform:translateX(0) skewX(-18deg)}35%,100%{transform:translateX(520px) skewX(-18deg)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <g transform="translate(0 0)">
    <rect x=".75" y=".75" width="286.5" height="122.5" rx="22" fill="url(#tile)" stroke="url(#tileEdge)" stroke-width="1.5"/>
    <g clip-path="url(#c0)"><rect class="sh" x="-120" y="0" width="90" height="124" fill="url(#sheen)" style="animation-delay:1.0s" transform="skewX(-18)"/></g>
    <circle cx="30" cy="34" r="3.5" fill="#67e8f9"/>
    <text x="46" y="39" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#93a1b8">years in engineering</text>
    <text x="28" y="94" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-size="46" font-weight="600" fill="url(#num)">5+</text>
    <rect x="28" y="112" width="44" height="2.5" rx="1.2" fill="#67e8f9" opacity=".8"/>
  </g>
  <clipPath id="c0"><rect x="0.75" y=".75" width="286.5" height="122.5" rx="22" transform="translate(0 0)"/></clipPath>
  <g transform="translate(306 0)">
    <rect x=".75" y=".75" width="286.5" height="122.5" rx="22" fill="url(#tile)" stroke="url(#tileEdge)" stroke-width="1.5"/>
    <g clip-path="url(#c1)"><rect class="sh" x="-120" y="0" width="90" height="124" fill="url(#sheen)" style="animation-delay:2.6s" transform="skewX(-18)"/></g>
    <circle cx="30" cy="34" r="3.5" fill="#c4b5fd"/>
    <text x="46" y="39" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#93a1b8">projects built and shipped</text>
    <text x="28" y="94" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-size="46" font-weight="600" fill="url(#num)">1,000+</text>
    <rect x="28" y="112" width="44" height="2.5" rx="1.2" fill="#c4b5fd" opacity=".8"/>
  </g>
  <clipPath id="c1"><rect x="306.75" y=".75" width="286.5" height="122.5" rx="22" transform="translate(-306 0)"/></clipPath>
  <g transform="translate(612 0)">
    <rect x=".75" y=".75" width="286.5" height="122.5" rx="22" fill="url(#tile)" stroke="url(#tileEdge)" stroke-width="1.5"/>
    <g clip-path="url(#c2)"><rect class="sh" x="-120" y="0" width="90" height="124" fill="url(#sheen)" style="animation-delay:4.2s" transform="skewX(-18)"/></g>
    <circle cx="30" cy="34" r="3.5" fill="#e6cf9d"/>
    <text x="46" y="39" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#93a1b8">Zamfara State, Nigeria</text>
    <text x="28" y="94" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-size="46" font-weight="600" fill="url(#num)">Gusau</text>
    <rect x="28" y="112" width="44" height="2.5" rx="1.2" fill="#e6cf9d" opacity=".8"/>
  </g>
  <clipPath id="c2"><rect x="612.75" y=".75" width="286.5" height="122.5" rx="22" transform="translate(-612 0)"/></clipPath>
</svg>
