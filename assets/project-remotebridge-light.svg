  <text x="90" y="53" font-family="'Iowan Old Style','Palatino Linotype',Georgia,serif" font-size="23" font-weight="600" fill="#17243a">RemoteBridge</text>
  <text x="90" y="71" font-family="Inter,'Segoe UI',system-ui,Arial,sans-serif" font-size="12.5" fill="#5d6f88">Cross-platform collaboration</text>
  <circle cx="293" cy="26" r="4.5" fill="#087f9a"/><text x="305" y="30.5" font-family="Inter,'Segoe UI',system-ui,Arial,sans-serif" font-size="13" fill="#344761">Desktop + mobile</text>
  <text x="24" y="108" font-family="Inter,'Segoe UI',system-ui,Arial,sans-serif" font-size="14" fill="#45566e">Self-hostable remote desktop and device fleet tools.</text>
  <text x="24" y="128" font-family="Inter,'Segoe UI',system-ui,Arial,sans-serif" font-size="14" fill="#45566e">Connect desktop and mobile clients through relay services.</text>
