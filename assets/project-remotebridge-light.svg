<svg xmlns="http://www.w3.org/2000/svg" width="440" height="200" viewBox="0 0 440 200" role="img" aria-label="RemoteBridge cross-platform remote desktop software">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0f5fd"/><stop offset="1" stop-color="#e5edf8"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c2b42" stop-opacity=".18"/><stop offset=".5" stop-color="#2563eb" stop-opacity=".22"/><stop offset="1" stop-color="#0c8598" stop-opacity=".2"/></linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#a8c9fc" stop-opacity=".3"/><stop offset="1" stop-color="#a8c9fc" stop-opacity="0"/></radialGradient>
    <clipPath id="clip"><rect width="440" height="200" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#clip)"><rect width="440" height="200" fill="url(#bg)"/><rect width="440" height="200" fill="url(#glow)"/></g>
  <rect x=".75" y=".75" width="438.5" height="198.5" rx="21.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  <path d="M30 .75H410" stroke="#2563eb" stroke-opacity=".27"/>
  <rect x="24" y="22" width="52" height="52" rx="15" fill="#e1ebfb" stroke="#c2d4f1"/>
  <g transform="translate(50 48)" fill="none" stroke="#356cc4" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-17" y="-12" width="22" height="16" rx="2.5"/><path d="M-10 9h8m-4-5v5"/>
