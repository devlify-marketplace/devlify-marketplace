<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img" aria-label="Animated terminal introducing Sadiq Abdullahi">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121212" stop-opacity=".22"/><stop offset=".5" stop-color="#b98e2f" stop-opacity=".2"/><stop offset="1" stop-color="#0c8598" stop-opacity=".25"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c2cee7"/><stop offset="1" stop-color="#cdd6ed"/></linearGradient>
    <radialGradient id="glow" cx=".85" cy="0" r=".9"><stop offset="0" stop-color="#0c8598" stop-opacity=".12"/><stop offset="1" stop-color="#0c8598" stop-opacity="0"/></radialGradient>
    <clipPath id="win"><rect width="900" height="350" rx="22"/></clipPath>
  </defs>
  <style>
    @keyframes t0{0%,4.891%{transform:translateX(0)}7.880%,99.99%{transform:translateX(75.2px)}100%{transform:translateX(0)}}
    @keyframes v0{0%,4.881%{opacity:0}4.891%,7.880%{opacity:1}7.890%,100%{opacity:0}}
    @keyframes t1{0%,9.783%{transform:translateX(0)}17.174%,99.99%{transform:translateX(639.2px)}100%{transform:translateX(0)}}
    @keyframes v1{0%,9.773%{opacity:0}9.783%,17.174%{opacity:1}17.184%,100%{opacity:0}}
    @keyframes t2{0%,20.163%{transform:translateX(0)}26.168%,99.99%{transform:translateX(159.8px)}100%{transform:translateX(0)}}
    @keyframes v2{0%,20.153%{opacity:0}20.163%,26.168%{opacity:1}26.178%,100%{opacity:0}}
    @keyframes t3{0%,28.071%{transform:translateX(0)}35.136%,99.99%{transform:translateX(611.0px)}100%{transform:translateX(0)}}
    @keyframes v3{0%,28.061%{opacity:0}28.071%,35.136%{opacity:1}35.146%,100%{opacity:0}}
    @keyframes t4{0%,38.125%{transform:translateX(0)}42.364%,99.99%{transform:translateX(112.8px)}100%{transform:translateX(0)}}
    @keyframes v4{0%,38.115%{opacity:0}38.125%,42.364%{opacity:1}42.374%,100%{opacity:0}}
    @keyframes t5{0%,44.266%{transform:translateX(0)}52.092%,99.99%{transform:translateX(676.8px)}100%{transform:translateX(0)}}
    @keyframes v5{0%,44.256%{opacity:0}44.266%,52.092%{opacity:1}52.102%,100%{opacity:0}}
    @keyframes t6{0%,55.082%{transform:translateX(0)}62.853%,99.99%{transform:translateX(206.8px)}100%{transform:translateX(0)}}
    @keyframes v6{0%,55.072%{opacity:0}55.082%,62.853%{opacity:1}62.863%,100%{opacity:0}}
    @keyframes t7{0%,64.755%{transform:translateX(0)}68.668%,99.99%{transform:translateX(338.4px)}100%{transform:translateX(0)}}
    @keyframes v7{0%,64.745%{opacity:0}64.755%,68.668%{opacity:1}68.678%,100%{opacity:0}}
    @keyframes fin{0%,71.658%{opacity:0}72.158%,100%{opacity:1}}
    .fade{animation:fade 18.4s linear infinite}
    @keyframes fade{0%,93%{opacity:1}97%,99.9%{opacity:0}100%{opacity:1}}
    .blink{animation:fin 18.4s linear infinite,bl 1.05s steps(1) infinite}
    @keyframes bl{50%{visibility:hidden}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}.cov,.cur{display:none}.blink{opacity:1}}
  </style>
  <g clip-path="url(#win)">
    <rect width="900" height="350" fill="#dae1f1"/>
    <rect width="900" height="46" fill="url(#bar)"/>
    <line x1="0" y1="46" x2="900" y2="46" stroke="#b8c5db"/>
    <circle cx="30" cy="23" r="6" fill="#cd0a00" opacity=".85"/><circle cx="52" cy="23" r="6" fill="#b37b01" opacity=".85"/><circle cx="74" cy="23" r="6" fill="#187826" opacity=".85"/>
    <text x="450.0" y="28" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#707f96">sadiq@devlify: ~/software-products</text>
    <g class="fade">
      <text x="40" y="100" xml:space="preserve" font-family="'JetBrains Mono','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15.5"><tspan fill="#b98e2f">$ </tspan><tspan fill="#08b4cb">whoami</tspan></text>
