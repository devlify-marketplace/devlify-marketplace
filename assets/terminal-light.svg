      <rect class="cur" x="38" y="84" width="8" height="20" rx="1.5" fill="#08b4cb" opacity="0" style="animation:t0 18.4s steps(8) infinite,v0 18.4s linear infinite"/></g>
      <text x="40" y="126" xml:space="preserve" font-family="'JetBrains Mono','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15.5"><tspan fill="#0d1424">sadiq-abdullahi</tspan><tspan fill="#3e4c60">, software developer and product builder</tspan></text>
      <g><rect class="cov" x="38" y="107" width="699" height="28" fill="#dae1f1" style="animation:t1 18.4s steps(68) infinite"/>
      <rect class="cur" x="38" y="110" width="8" height="20" rx="1.5" fill="#08b4cb" opacity="0" style="animation:t1 18.4s steps(68) infinite,v1 18.4s linear infinite"/></g>
      <text x="40" y="156" xml:space="preserve" font-family="'JetBrains Mono','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15.5"><tspan fill="#b98e2f">$ </tspan><tspan fill="#08b4cb">cat </tspan><tspan fill="#0d1424">mission.txt</tspan></text>
      <g><rect class="cov" x="38" y="137" width="220" height="28" fill="#dae1f1" style="animation:t2 18.4s steps(17) infinite"/>
      <rect class="cur" x="38" y="140" width="8" height="20" rx="1.5" fill="#08b4cb" opacity="0" style="animation:t2 18.4s steps(17) infinite,v2 18.4s linear infinite"/></g>
      <text x="40" y="182" xml:space="preserve" font-family="'JetBrains Mono','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15.5"><tspan fill="#3e4c60">Turn practical problems into dependable, useful software.</tspan></text>
      <g><rect class="cov" x="38" y="163" width="671" height="28" fill="#dae1f1" style="animation:t3 18.4s steps(65) infinite"/>
      <rect class="cur" x="38" y="166" width="8" height="20" rx="1.5" fill="#08b4cb" opacity="0" style="animation:t3 18.4s steps(65) infinite,v3 18.4s linear infinite"/></g>
      <text x="40" y="212" xml:space="preserve" font-family="'JetBrains Mono','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15.5"><tspan fill="#b98e2f">$ </tspan><tspan fill="#08b4cb">ls </tspan><tspan fill="#0d1424">./focus</tspan></text>
      <g><rect class="cov" x="38" y="193" width="173" height="28" fill="#dae1f1" style="animation:t4 18.4s steps(12) infinite"/>
      <rect class="cur" x="38" y="196" width="8" height="20" rx="1.5" fill="#08b4cb" opacity="0" style="animation:t4 18.4s steps(12) infinite,v4 18.4s linear infinite"/></g>
      <text x="40" y="238" xml:space="preserve" font-family="'JetBrains Mono','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15.5"><tspan fill="#08b4cb">product-systems/</tspan><tspan fill="#0d1424">  </tspan><tspan fill="#170364">full-stack-systems/</tspan><tspan fill="#0d1424">  </tspan><tspan fill="#08b4cb">ai-and-dev-tools/</tspan><tspan fill="#0d1424">  </tspan><tspan fill="#170364">reliable-delivery/</tspan></text>
      <g><rect class="cov" x="38" y="219" width="737" height="28" fill="#dae1f1" style="animation:t5 18.4s steps(72) infinite"/>
      <rect class="cur" x="38" y="222" width="8" height="20" rx="1.5" fill="#08b4cb" opacity="0" style="animation:t5 18.4s steps(72) infinite,v5 18.4s linear infinite"/></g>
      <text x="40" y="268" xml:space="preserve" font-family="'JetBrains Mono','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15.5"><tspan fill="#b98e2f">$ </tspan><tspan fill="#08b4cb">git </tspan><tspan fill="#0d1424">log -1 --oneline</tspan></text>
      <g><rect class="cov" x="38" y="249" width="267" height="28" fill="#dae1f1" style="animation:t6 18.4s steps(22) infinite"/>
      <rect class="cur" x="38" y="252" width="8" height="20" rx="1.5" fill="#08b4cb" opacity="0" style="animation:t6 18.4s steps(22) infinite,v6 18.4s linear infinite"/></g>
      <text x="40" y="294" xml:space="preserve" font-family="'JetBrains Mono','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15.5"><tspan fill="#b98e2f">a3f9c2e </tspan><tspan fill="#3e4c60">ship it, then make it better</tspan></text>
      <g><rect class="cov" x="38" y="275" width="398" height="28" fill="#dae1f1" style="animation:t7 18.4s steps(36) infinite"/>
      <rect class="cur" x="38" y="278" width="8" height="20" rx="1.5" fill="#08b4cb" opacity="0" style="animation:t7 18.4s steps(36) infinite,v7 18.4s linear infinite"/></g>
      <g class="blink" opacity="0"><text x="40" y="324" font-family="'JetBrains Mono','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15.5" fill="#b98e2f">$</text><rect x="56.8" y="308" width="8" height="20" rx="1.5" fill="#08b4cb"/></g>
    </g>
    <rect y="46" width="900" height="304" fill="url(#glow)"/>
