<svg xmlns="http://www.w3.org/2000/svg" width="440" height="200" viewBox="0 0 440 200" role="img" aria-label="FUGUSAU Portal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dbe2f2"/><stop offset="1" stop-color="#d1cbee"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121212" stop-opacity=".18"/><stop offset=".5" stop-color="#b98e2f" stop-opacity=".18"/><stop offset="1" stop-color="#0c8598" stop-opacity=".2"/></linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#170364" stop-opacity=".20"/><stop offset="1" stop-color="#170364" stop-opacity="0"/></radialGradient>
    <filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <clipPath id="c"><rect width="440" height="200" rx="22"/></clipPath>
  </defs>
  <style>
    .trace{animation:trace 9s linear 4.4s infinite}
    @keyframes trace{to{stroke-dashoffset:-100}}
    .cell{animation:cell 2.4s ease-in-out infinite}
    @keyframes cell{0%,100%{opacity:.3}50%{opacity:1}}
    .slash{animation:cell 2s ease-in-out infinite}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pl 2.4s ease-in-out infinite}
    @keyframes pl{50%{transform:scale(1.5)}}
    .chk{animation:chk 4s ease-in-out infinite}
    @keyframes chk{0%,25%{stroke-dashoffset:20}50%,90%{stroke-dashoffset:0}100%{stroke-dashoffset:20}}
    .spark{transform-box:fill-box;transform-origin:center;animation:sp 3s ease-in-out infinite}
    @keyframes sp{50%{transform:scale(1.5) rotate(45deg)}}
    .plus{transform-box:fill-box;transform-origin:center;animation:pp 4s ease-in-out infinite}
    @keyframes pp{40%,60%{transform:rotate(90deg)}100%{transform:rotate(90deg)}}
    .glow{animation:gl 6s ease-in-out 4.4s infinite alternate}
    @keyframes gl{from{opacity:.55}to{opacity:1}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#c)">
    <rect width="440" height="200" fill="url(#bg)"/>
    <rect class="glow" width="440" height="200" fill="url(#glow)"/>
  </g>
  <rect x=".75" y=".75" width="438.5" height="198.5" rx="21.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
  <rect class="trace" x=".75" y=".75" width="438.5" height="198.5" rx="21.25" fill="none" stroke="#170364" stroke-width="2.2" stroke-linecap="round" pathLength="100" stroke-dasharray="9 91" filter="url(#b)"/>
  <path d="M30 .75 H410" stroke="#b98e2f" stroke-opacity=".3"/>
  <rect x="24" y="22" width="52" height="52" rx="15" fill="#b6b2e5" stroke="#816ece"/>
  <g transform="translate(50 48)"><path d="M0 -12 L15 -4 L0 4 L-15 -4 Z" fill="none" stroke="#170364" stroke-width="2.2" stroke-linejoin="round"/><path d="M-8 1 V8 C-4 12 4 12 8 8 V1" fill="none" stroke="#170364" stroke-width="2.2" stroke-linecap="round"/><path class="slash" d="M15 -4 V6" stroke="#121212" stroke-opacity=".8" stroke-width="2" stroke-linecap="round"/></g>
  <text x="90" y="53" font-family="'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-size="23" font-weight="600" fill="#0d1424">FUGUSAU Portal</text>
  <text x="90" y="71" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#76869c">Production work</text>
  <circle cx="327.6" cy="26" r="4.5" fill="#170364"/><text x="339.6" y="30.5" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13" fill="#222f46">Education</text>
  <text x="24" y="108" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#4d5c75">Student portal with full-text search,</text><text x="24" y="128" font-family="'Inter','SF Pro Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="14" fill="#4d5c75">dark mode and an AI fallback chain.</text>
  <g transform="translate(24.0 146)"><rect width="64.6" height="26" rx="13" fill="#c8d5ef" stroke="#acbcd9"/><text x="32.3" y="17.5" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#2e3d58">Django</text></g><g transform="translate(96.6 146)"><rect width="57.5" height="26" rx="13" fill="#c8d5ef" stroke="#acbcd9"/><text x="28.8" y="17.5" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#2e3d58">React</text></g><g transform="translate(162.1 146)"><rect width="93.0" height="26" rx="13" fill="#c8d5ef" stroke="#acbcd9"/><text x="46.5" y="17.5" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#2e3d58">PostgreSQL</text></g>
</svg>
