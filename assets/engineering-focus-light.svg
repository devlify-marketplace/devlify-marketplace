  <title id="t">Engineering focus</title>
  <desc id="d">Four animated themes: full-stack systems, applied AI/ML, developer tools, reliable delivery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dfe5f4"/><stop offset="1" stop-color="#cfcaed"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121212" stop-opacity=".2"/><stop offset=".5" stop-color="#b98e2f" stop-opacity=".2"/><stop offset="1" stop-color="#0c8598" stop-opacity=".22"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b98e2f"/><stop offset="1" stop-color="#9d7c39"/></linearGradient>
    <radialGradient id="spot"><stop offset="0" stop-color="#0c8598" stop-opacity=".30"/><stop offset="1" stop-color="#0c8598" stop-opacity="0"/></radialGradient>
