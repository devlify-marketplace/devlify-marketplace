  </defs>
  <style>
    .spot{animation:spot 9s ease-in-out infinite alternate}
    @keyframes spot{from{transform:translateX(0)}to{transform:translateX(615px)}}
    .scan{animation:scan 2.8s ease-in-out infinite}
    @keyframes scan{0%{transform:translateY(0)}50%{transform:translateY(31px)}100%{transform:translateY(0)}}
    .lay1{animation:lay 3.4s ease-in-out infinite}
    .lay2{animation:lay 3.4s ease-in-out .25s infinite}
    @keyframes lay{50%{transform:translateY(-3.5px)}}
    .flow{animation:flow 1.6s linear infinite}
    .f2{animation-delay:-.8s}
    @keyframes flow{to{stroke-dashoffset:-31}}
    .core{transform-box:fill-box;transform-origin:center;animation:core 2.4s ease-in-out infinite}
    @keyframes core{50%{transform:scale(1.35)}}
    .prog{animation:prog 4.6s ease-in-out infinite}
    @keyframes prog{0%{stroke-dashoffset:81.7}55%,92%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
    .tick{animation:tick 4.6s ease-in-out infinite}
    @keyframes tick{0%,45%{stroke-dashoffset:20}62%,92%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
