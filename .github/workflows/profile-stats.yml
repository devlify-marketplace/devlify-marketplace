name: Update recent repositories

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-recent-repositories
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # This public-only updater never runs profile_stats.py or writes assets.
      - name: Refresh public recent repositories only
        env:
          PROFILE_USER: ${{ github.repository_owner }}
        run: python .github/scripts/recent_repos.py

      - name: Commit recent-list changes only
        run: |
          git config user.name "profile-bot"
          git config user.email "profile-bot@users.noreply.github.com"
          git add -- README.md
          git diff --cached --quiet || (git commit -m "chore: refresh public recent repositories" && git push)
